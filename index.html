<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>時計</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="icons/icon-192.svg">
    <style>
        /*
  Josh's Custom CSS Reset
  https://www.joshwcomeau.com/css/custom-css-reset/
*/
        *,
        *::before,
        *::after {
            box-sizing: border-box
        }

        * {
            margin: 0
        }

        @media (prefers-reduced-motion:no-preference) {
            html {
                interpolate-size: allow-keywords
            }
        }

        body {
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        img,
        picture,
        video,
        canvas,
        svg {
            display: block;
            max-width: 100%
        }

        input,
        button,
        textarea,
        select {
            font: inherit
        }

        p,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            overflow-wrap: break-word
        }

        p {
            text-wrap: pretty
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            text-wrap: balance
        }

        #root,
        #__next {
            isolation: isolate
        }
    </style>
</head>

<body style="">
    <div id="clock-container">
        <div class="time-display">
            <h2 class="jp-font">日本標準時 (JST)</h2>
            <div id="jst-time" class="seven-segment"></div>
        </div>
        <div class="time-display">
            <h2 class="jp-font">世界標準時 (UTC)</h2>
            <div id="utc-time" class="seven-segment"></div>
        </div>
        <div class="time-display pb-0">
            <h2 class="jp-font">UNIX Time</h2>
            <div id="unix-time" class="seven-segment"></div>
        </div>
        <div id="sync-status" style="display: none;">
            NICT時刻サーバーと同期中...
        </div>
    </div>

    <style>
        body {
            background-color: #000;
        }

        @font-face {
            font-family: 'DSEG7';
            src: url('./DSEG7ClassicMini-Italic.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        #clock-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #000;
            color: #fff;
            padding: 0;
            overflow-x: hidden;
        }

        .time-display {
            margin: 0;
            color: #fff;
            text-align: center;
            width: 100%;
            padding-bottom: 50px;
        }

        .time-display .jp {
            font-family: 'Kosugi Maru', sans-serif;
            font-size: clamp(1.5rem, 4vw, 3rem);
            color: #d0d0d0;
        }

        .time-display h2 {
            margin: 0;
            padding: 0px 0;
            font-size: clamp(1.2rem, 3vw, 2rem);
            color: #000000;
            width: 100vw;
            background-color: #ffffff;
        }

        .seven-segment {
            width: 100vw;
            font-family: 'DSEG7', monospace;
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: bold;
            color: #ffffff;
            background-color: #000000;
            padding: 15px 10px;
            border-radius: 0px;
            border: 2px solid #000000;
            letter-spacing: 0.05em;
            line-height: 1.2;
            word-break: break-all;
            white-space: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .seven-segment::-webkit-scrollbar {
            display: none;
        }

        .jp-font {
            font-family: 'Kosugi Maru', sans-serif;
            color: #000000;
            font-size: clamp(1.2rem, 3vw, 2rem);
            margin: 0;
            padding: 0;
        }

        #sync-status {
            color: #888;
            text-align: center;
            margin-top: 15px;
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            padding: 0 20px;
            word-break: break-word;
        }

        /* タブレット用（768px以下） */
        @media (max-width: 768px) {
            #clock-container {
                padding: 0;
            }

            .time-display {
                margin: 0;
            }

            .seven-segment {
                padding: 12px 8px;
                font-size: clamp(1.8rem, 5vw, 3.5rem);
            }

            .time-display h2 {
                padding: 0px 0;
                margin: 0;
            }

            .jp-font {
                padding: 0;
                margin: 0;
            }
        }

        /* スマートフォン用（480px以下） */
        @media (max-width: 480px) {
            #clock-container {
                padding: 0;
                justify-content: flex-start;
            }

            .time-display {
                margin: 0;
                padding-bottom: 30px;
            }

            .seven-segment {
                padding: 10px 5px;
                font-size: clamp(1.5rem, 4.5vw, 2.5rem);
                letter-spacing: 0.02em;
            }

            .time-display h2 {
                padding: 0;
                margin: 0;
                font-size: clamp(1rem, 2.5vw, 1.5rem);
            }

            .jp-font {
                padding: 0;
                margin: 0;
            }

            .time-display .jp {
                font-size: clamp(1.2rem, 3vw, 2rem);
            }

            #sync-status {
                margin-top: 10px;
                font-size: clamp(0.6rem, 1.8vw, 0.8rem);
                padding: 0 15px;
            }
        }

        /* 超小型デバイス用（320px以下） */
        @media (max-width: 320px) {
            .seven-segment {
                font-size: clamp(1.2rem, 4vw, 2rem);
                padding: 8px 3px;
            }

            .time-display h2 {
                font-size: clamp(0.9rem, 2.2vw, 1.3rem);
                padding: 0;
                margin: 0;
            }

            .jp-font {
                padding: 0;
                margin: 0;
            }

            #sync-status {
                font-size: clamp(0.5rem, 1.5vw, 0.7rem);
            }
        }

        /* 横向き対応 */
        @media (max-height: 600px) and (orientation: landscape) {
            #clock-container {
                padding: 0;
            }

            .time-display {
                margin: 0;
                padding-bottom: 30px;
            }

            .time-display h2 {
                padding: 0px 0;
                margin: 0;
            }

            .jp-font {
                padding: 0px 0;
                margin: 0;
            }

            .seven-segment {
                padding: 5px;
            }

            #sync-status {
                margin-top: 5px;
            }
        }

        /* ダークモード対応 */
        @media (prefers-color-scheme: dark) {
            #clock-container {
                background-color: #000;
            }
        }

        /* 高コントラスト対応 */
        @media (prefers-contrast: high) {
            .seven-segment {
                border: 3px solid #333;
            }

            .time-display h2 {
                background-color: #fff;
                color: #000;
            }
        }

        /* モーション軽減対応 */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* タッチデバイス用の改善 */
        @media (hover: none) and (pointer: coarse) {
            .seven-segment {
                -webkit-tap-highlight-color: transparent;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none;
            }
        }

        .pb-0 {
            padding-bottom: 0 !important;
        }

        /* Portrait (height > width) -> rotate whole clock 90deg */
        .rotate-90 {
            position: absolute;
            top: 50%;
            left: 50%;
            /* swap dimensions so content fits after rotation */
            width: 100vh;
            height: 100vw;
            transform: translate(-50%, -50%) rotate(90deg);
            transform-origin: center center;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* When rotated, make inner elements size relative to the rotated container */
        .rotate-90 .time-display,
        .rotate-90 .seven-segment,
        .rotate-90 .time-display h2 {
            width: 100% !important;
        }

        /* Prevent horizontal scroll after rotation */
        body.rotate-active {
            overflow: hidden;
        }
    </style>
    <script>
        // 定数
        const NICT_API_URL = 'https://67495dde3b39c2991829589f0101ab7a035eecf5.nict.go.jp/cgi-bin/json';
        const JST_OFFSET = 9 * 60 * 60 * 1000;
        const SYNC_INTERVAL_MS = 30000;
        const UPDATE_INTERVAL_MS = 100;

        // 状態管理
        let timeOffset = 0;
        let lastSyncTime = 0;
        let syncInterval = null;

        // DOM取得
        const elJst = document.getElementById('jst-time');
        const elUtc = document.getElementById('utc-time');
        const elUnix = document.getElementById('unix-time');
        const elSyncStatus = document.getElementById('sync-status');

        // NICT時刻サーバーと同期
        async function syncWithNICT() {
            try {
                const requestStart = Date.now();
                const response = await fetch(`${NICT_API_URL}?${requestStart}`, { cache: 'no-store' });
                const requestEnd = Date.now();
                if (!response.ok) throw new Error('NICT時刻サーバーとの通信に失敗しました');
                const data = await response.json();
                const networkDelay = (requestEnd - requestStart) / 2;
                const serverTime = (data.st * 1000) + networkDelay;
                const clientTime = Date.now();
                timeOffset = serverTime - clientTime;
                lastSyncTime = clientTime;
                if (elSyncStatus) {
                    elSyncStatus.textContent = `NICT同期完了: ${new Date(lastSyncTime).toLocaleTimeString()} (オフセット: ${timeOffset.toFixed(0)}ms)`;
                }
                console.log(`NICT時刻サーバーと同期完了。オフセット: ${timeOffset}ms`);
            } catch (error) {
                console.error('NICT時刻サーバーとの同期に失敗:', error);
                if (elSyncStatus) {
                    elSyncStatus.textContent = `同期エラー: ${error.message}`;
                }
            }
        }

        // NICTオフセット考慮の現在時刻
        function getAccurateTime() {
            return new Date(Date.now() + timeOffset);
        }

        // 時刻表示のHTML生成
        function formatTimeHTML(year, month, date, hours, minutes, seconds) {
            return `${year}<span class="jp">年</span>${month}<span class="jp">月</span>${date}<span class="jp">日</span>${hours}<span class="jp">時</span>${minutes}<span class="jp">分</span>${seconds}<span class="jp">秒</span>`;
        }

        // 時刻更新
        function updateTime() {
            const now = getAccurateTime();
            // JST
            const jst = new Date(now.getTime() + JST_OFFSET);
            if (elJst) {
                elJst.innerHTML = formatTimeHTML(
                    jst.getUTCFullYear(),
                    String(jst.getUTCMonth() + 1).padStart(2, '!'),
                    String(jst.getUTCDate()).padStart(2, '!'),
                    String(jst.getUTCHours()).padStart(2, '!'),
                    String(jst.getUTCMinutes()).padStart(2, '!'),
                    String(jst.getUTCSeconds()).padStart(2, '!')
                );
            }
            // UTC
            if (elUtc) {
                elUtc.innerHTML = formatTimeHTML(
                    now.getUTCFullYear(),
                    String(now.getUTCMonth() + 1).padStart(2, '!'),
                    String(now.getUTCDate()).padStart(2, '!'),
                    String(now.getUTCHours()).padStart(2, '!'),
                    String(now.getUTCMinutes()).padStart(2, '!'),
                    String(now.getUTCSeconds()).padStart(2, '!')
                );
            }
            // UNIX Time
            if (elUnix) {
                elUnix.innerHTML = `${Math.floor(now.getTime() / 1000)}<span class="jp">秒</span>`;
            }
        }

        // 初期化
        async function initClock() {
            await syncWithNICT();
            updateTime();
            setInterval(updateTime, UPDATE_INTERVAL_MS);
            syncInterval = setInterval(syncWithNICT, SYNC_INTERVAL_MS);
        }

        // 回転判定
        function applyRotationIfPortrait() {
            const isPortrait = window.innerHeight > window.innerWidth;
            const body = document.body;
            const clockContainer = document.getElementById('clock-container');
            if (!clockContainer) return;
            if (isPortrait) {
                body.classList.add('rotate-active');
                clockContainer.classList.add('rotate-90');
                clockContainer.style.minHeight = '100vw';
                clockContainer.style.left = '40%';
            } else {
                body.classList.remove('rotate-active');
                clockContainer.classList.remove('rotate-90');
                clockContainer.style.minHeight = '100vh';
                clockContainer.style.left = '';
            }
        }

        // イベント登録
        window.addEventListener('load', () => {
            applyRotationIfPortrait();
            initClock();
        });
        window.addEventListener('resize', () => {
            clearTimeout(window._rotateTimer);
            window._rotateTimer = setTimeout(applyRotationIfPortrait, 80);
        });
        window.addEventListener('orientationchange', () => setTimeout(applyRotationIfPortrait, 120));
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) syncWithNICT();
        });
    </script>
    <script>
        // Service Worker registration for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered.', reg))
                    .catch(err => console.warn('Service Worker registration failed:', err));
            });
        }

        // Basic beforeinstallprompt handling (show native install prompt later)
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e; // Stash the event for later use
            // You could show an install button here and call deferredPrompt.prompt()
            console.log('beforeinstallprompt fired');
        });

        // キーボードによる手動同期: 'r' または 'R' が押されたら NICT と同期
        document.addEventListener('keydown', (e) => {
            try {
                if (!e || !e.key) return;
                if (e.key.toLowerCase() === 'r') {
                    const statusEl = document.getElementById('sync-status');
                    if (statusEl) {
                        statusEl.style.display = 'block';
                        statusEl.textContent = '手動同期中...';
                    }
                    // 非同期で同期処理を呼び出す（既存の同期関数を再利用）
                    syncWithNICT();
                }
            } catch (err) {
                console.warn('手動同期エラー:', err);
            }
        });
    </script>
</body>

</html>
